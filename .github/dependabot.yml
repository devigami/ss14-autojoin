# Dependabot: keep the Python dependencies (uv.lock) and the GitHub Actions in the workflows current.
# Pull requests are grouped so a routine week produces one PR per ecosystem, labelled so the release notes
# file them under "Other changes" unless a maintainer relabels them.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, skip-changelog]
    commit-message:
      prefix: deps
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
      # Majors stay separate: pyinstaller, mkdocs-material and psutil have each broken things on a major before.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies, skip-changelog]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
