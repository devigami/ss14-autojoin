name: release
# When a change lands on master (normally a merged pull request) and pyproject.toml carries a version that
# has no tag yet, build the executables on Windows and Linux and publish a GitHub release v<version> with
# the binaries attached and release notes generated from the merged pull requests (.github/release.yml).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: v${{ steps.read.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: read
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version"
      - id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.read.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "tag already exists; nothing to release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run python build.py
      - run: uv run python build.py --cli
      - name: Name the binaries
        shell: bash
        run: |
          mkdir -p out
          v="${{ needs.version.outputs.version }}"
          if [ "${{ matrix.label }}" = "windows" ]; then
            cp dist/SS14AutoJoin.exe "out/SS14AutoJoin-$v-windows-x64.exe"
            cp dist/ss14-autojoin.exe "out/ss14-autojoin-$v-windows-x64.exe"
          else
            cp dist/SS14AutoJoin "out/SS14AutoJoin-$v-linux-x64"
            cp dist/ss14-autojoin "out/ss14-autojoin-$v-linux-x64"
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.label }}
          path: out/*

  release:
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SS14 Auto-Join ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
          body: |
            Single-file builds. Windows is the tested platform; the Linux builds are provided untested.
            `SS14AutoJoin-*` is the window, `ss14-autojoin-*` the console tool. Documentation:
            https://devigami.github.io/ss14-autojoin/
