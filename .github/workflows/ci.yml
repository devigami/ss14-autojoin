name: ci
on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the jobs only check out code and upload artifacts, so the token needs read access alone.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run mkdocs build --strict
        if: matrix.os == 'ubuntu-latest'

  windows-app:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run python build.py
      - run: uv run python build.py --cli
      - run: dist\ss14-autojoin.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: SS14AutoJoin-windows
          path: dist/*.exe
