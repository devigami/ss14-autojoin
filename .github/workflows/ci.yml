name: ci
on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the jobs only check out code and upload artifacts, so the token needs read access alone.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run mkdocs build --strict
        if: matrix.os == 'ubuntu-latest'

  windows-app:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run python build.py
      - run: uv run python build.py --cli
      # Both executables must start, exit 0 and print the version. The window build has no console, so this
      # is the check that `SS14AutoJoin --version` reaches a caller that captures the output.
      - run: uv run python tools/smoke_version.py dist/SS14AutoJoin.exe dist/ss14-autojoin.exe
      - name: The forms the documentation gives for a terminal print the version
        shell: pwsh
        run: |
          # PowerShell waits for a windowed program only when something follows it in the pipeline. A bare
          # `$v = SS14AutoJoin --version` returns at once with nothing (seen on this runner), so the
          # documentation gives the piped forms, and these are the ones checked here.
          $piped = .\dist\SS14AutoJoin.exe --version | Out-String
          "PowerShell, piped and captured: '$($piped.Trim())'"
          $viaCmd = (cmd /c "dist\SS14AutoJoin.exe --version | more" | Out-String).Trim()
          "Command Prompt, piped:          '$viaCmd'"
          if ($piped.Trim() -notmatch '^SS14 Auto-Join \d+\.\d+\.\d+$') { throw "the PowerShell form printed something else" }
          if ($viaCmd -ne $piped.Trim()) { throw "the Command Prompt form printed something else" }
      - uses: actions/upload-artifact@v7
        with:
          name: SS14AutoJoin-windows
          path: dist/*.exe

  linux-app:
    # Joining is untested on Linux, but the builds we publish must at least start. With some Python patch
    # releases PyInstaller cannot find the Tcl/Tk libraries, warns, and writes a window build that dies on
    # import (see build.py); only starting the result shows it.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run python build.py
      - run: uv run python build.py --cli
      - run: uv run python tools/smoke_version.py dist/SS14AutoJoin dist/ss14-autojoin
      - name: The window opens on a virtual display and stays open
        env:
          SS14_AUTOJOIN_CONFIG: ${{ runner.temp }}/ss14-autojoin-ci.toml
        run: |
          # timeout ends a healthy window after 10 s with status 124; a crash exits sooner with its own status
          status=0
          xvfb-run -a timeout 10 dist/SS14AutoJoin || status=$?
          echo "exit status: $status"
          test "$status" -eq 124
