[project]
name = "ss14-autojoin"
version = "1.0.0"
description = "Watches a Space Station 14 server and joins it through the official launcher as soon as a player slot is free."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "psutil>=6",
]

[project.scripts]
ss14-autojoin = "ss14_autojoin.cli:main"
ss14-autojoin-gui = "ss14_autojoin.app:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "pyinstaller>=6.16",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss14_autojoin"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
